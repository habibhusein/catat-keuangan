<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pencatat Keuangan Bulanan</title>
    
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f7f6; color: #333; }
        .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h2, h3 { text-align: center; color: #2c3e50; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        
        /* Tombol-tombol */
        button { width: 100%; padding: 12px; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; margin-bottom: 10px; font-weight: bold; }
        .btn-simpan { background-color: #27ae60; }
        .btn-excel { background-color: #2980b9; }
        .btn-hapus { background-color: #c0392b; font-size: 14px; padding: 8px; }
        
        .total-box { background-color: #ecf0f1; padding: 15px; text-align: center; font-size: 20px; font-weight: bold; border-radius: 5px; margin: 20px 0; color: #2c3e50; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 14px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #34495e; color: white; }
    </style>
</head>
<body>

<div class="container">
    <h2>Keuangan Bulanan</h2>
    
    <div class="total-box">
        Total Bulan Ini: <br>
        <span id="totalPengeluaran">Rp 0</span>
    </div>

    <div class="form-group">
        <label>Tanggal</label>
        <input type="date" id="tanggal" required>
    </div>
    <div class="form-group">
        <label>Kategori</label>
        <select id="kategori">
            <option value="Makanan & Minuman">Makanan & Minuman</option>
            <option value="Transportasi">Transportasi</option>
            <option value="Tagihan/Bulanan">Tagihan/Bulanan</option>
            <option value="Hiburan">Hiburan</option>
        </select>
    </div>
    <div class="form-group">
        <label>Jumlah (Rp)</label>
        <input type="number" id="jumlah" placeholder="Contoh: 50000" required>
    </div>
    <div class="form-group">
        <label>Periode</label>
        <select id="periode">
            <option value="Mingguan">Mingguan</option>
            <option value="Bulanan">Bulanan</option>
        </select>
    </div>
    
    <button class="btn-simpan" onclick="simpanData()">Simpan Data</button>
    <button class="btn-excel" onclick="downloadExcel()">Simpan ke Excel (.xlsx)</button>

    <h3>Riwayat Pengeluaran</h3>
    <table id="tabelRiwayat">
        <thead>
            <tr>
                <th>Tanggal</th>
                <th>Kategori</th>
                <th>Jumlah</th>
                <th>Periode</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
    
    <br><br>
    <button class="btn-hapus" onclick="resetDataBulanIni()">Reset Data (Mulai Bulan Baru)</button>
</div>

<script>
    // Set tanggal otomatis ke hari ini saat aplikasi dibuka
    document.getElementById('tanggal').valueToDate = new Date();

    window.onload = function() {
        tampilkanDanHitungData();
    };

    function simpanData() {
        const tanggal = document.getElementById('tanggal').value;
        const kategori = document.getElementById('kategori').value;
        const jumlah = parseInt(document.getElementById('jumlah').value);
        const periode = document.getElementById('periode').value;

        if (!tanggal || !jumlah) {
            alert("Mohon isi tanggal dan jumlah uang!");
            return;
        }

        let dataPengeluaran = JSON.parse(localStorage.getItem('dataKeuangan')) || [];
        dataPengeluaran.push({ Tanggal: tanggal, Kategori: kategori, Jumlah: jumlah, Periode: periode });
        
        localStorage.setItem('dataKeuangan', JSON.stringify(dataPengeluaran));
        document.getElementById('jumlah').value = '';
        
        tampilkanDanHitungData();
    }

    function tampilkanDanHitungData() {
        let dataPengeluaran = JSON.parse(localStorage.getItem('dataKeuangan')) || [];
        const tbody = document.querySelector('#tabelRiwayat tbody');
        const totalSpan = document.getElementById('totalPengeluaran');
        
        tbody.innerHTML = '';
        let total = 0;

        // Urutkan data berdasarkan tanggal terbaru
        dataPengeluaran.sort((a, b) => new Date(b.Tanggal) - new Date(a.Tanggal));

        dataPengeluaran.forEach(item => {
            total += item.Jumlah;
            let row = `<tr>
                <td>${item.Tanggal}</td>
                <td>${item.Kategori}</td>
                <td>Rp ${item.Jumlah.toLocaleString('id-ID')}</td>
                <td>${item.Periode}</td>
            </tr>`;
            tbody.innerHTML += row;
        });

        totalSpan.innerText = "Rp " + total.toLocaleString('id-ID');
    }

    // FUNGSI UTAMA UNTUK DOWNLOAD EXCEL (.XLSX)
    function downloadExcel() {
        let dataPengeluaran = JSON.parse(localStorage.getItem('dataKeuangan')) || [];
        
        if (dataPengeluaran.length === 0) {
            alert("Belum ada data keuangan yang disimpan bulan ini!");
            return;
        }

        // Mengubah data JSON menjadi sheet Excel
        const worksheet = XLSX.utils.json_to_sheet(dataPengeluaran);
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "Laporan Keuangan");

        // Mengatur nama file otomatis berdasarkan bulan & tahun saat ini
        const infoWaktu = new Date();
        const namaBulan = infoWaktu.toLocaleString('id-ID', { month: 'long' });
        const tahun = infoWaktu.getFullYear();
        const namaFile = `Laporan_Keuangan_${namaBulan}_${tahun}.xlsx`;

        // Jalankan perintah download file Excel ke HP
        XLSX.writeFile(workbook, namaFile);
    }

    function resetDataBulanIni() {
        if (confirm("Apakah Anda yakin ingin menghapus data di aplikasi? Pastikan Anda sudah mendownload file Excel bulan ini terlebih dahulu sebagai backup.")) {
            localStorage.removeItem('dataKeuangan');
            tampilkanDanHitungData();
        }
    }
</script>

</body>
</html>
